# Resonance Core — Default Tiered Autonomy Configuration
# Place this file at .resonance/config.yml in any repository that installs the app

autonomy:
  # Default tier when classification is ambiguous (1=Guardian, 2=Co-Pilot, 3=Autopilot)
  default_tier: 2

  # File patterns that ALWAYS require Tier 1 (Guardian) — human review mandatory
  tier_1_required_patterns:
    - "**/auth/**"
    - "**/authentication/**"
    - "**/authorization/**"
    - "**/database/**"
    - "**/db/**"
    - "**/billing/**"
    - "**/payments/**"
    - "**/migrations/**"
    - "**/schema.prisma"
    - "**/schema.graphql"
    - "**/docker-compose*.yml"
    - "**/Dockerfile*"
    - "**/.github/workflows/**"
    - "**/terraform/**"
    - "**/infra/**"

  # File patterns eligible for Tier 3 (Autopilot) — auto-merge allowed
  tier_3_allowed_patterns:
    - "*.eslintrc*"
    - "*.prettierrc*"
    - ".stylelintrc*"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "*.md"
    - "*.mdx"
    - "**/CHANGELOG*"
    - "**/CONTRIBUTING*"
    - ".github/dependabot.yml"
    - ".github/renovate.json"

  # Risk score thresholds (1-10, higher = riskier)
  risk_thresholds:
    tier_1_min: 7      # risk_score >= 7 → Tier 1
    tier_3_max: 3      # risk_score <= 3 AND confidence >= 9 → Tier 3

  # Confidence score thresholds (1-10, higher = more confident)
  confidence_thresholds:
    tier_1_max: 6      # confidence <= 6 → Tier 1 (even if risk is low)
    tier_3_min: 9      # confidence >= 9 required for Tier 3

  # Change scope limits
  change_limits:
    tier_3_max_lines: 5        # Tier 3 only for <= 5 lines changed
    tier_1_min_lines: 50       # Tier 1 for >= 50 lines changed

# Cost tracking
cost_tracking:
  enabled: true
  # Approximate rates per 1K tokens (update from Nebius pricing)
  rates_usd_per_1k:
    nemotron_nano: 0.0001
    nemotron_ultra: 0.0005
  # Display in PR body
  show_in_pr: true
  show_in_dashboard: true

# Dashboard
dashboard:
  theme: "dark"  # "dark" | "light" | "auto"
  font_family: "JetBrains Mono, Fira Code, monospace"
  background_color: "#0D1117"
  accent_color: "#58A6FF"
  success_color: "#3FB950"
  warning_color: "#D29922"
  error_color: "#F85149"

# Notifications
notifications:
  slack:
    enabled: false
    webhook_url_env: "SLACK_WEBHOOK_URL"
    notify_on:
      - tier_3_auto_merge
      - tier_1_draft_pr
      - validation_failed
  github:
    enabled: true
    notify_on:
      - pr_created
      - pr_updated
      - validation_passed
      - validation_failed

# Security
security:
  log_sanitization:
    enabled: true
    patterns:
      - "AKIA[0-9A-Z]{16}"                    # AWS Access Key ID
      - "aws_secret_access_key[\\s:=]+[A-Za-z0-9/+=]{40}"  # AWS Secret
      - "eyJ[A-Za-z0-9_-]*\\.eyJ[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*"  # JWT
      - "Bearer\\s+[A-Za-z0-9_-]+"            # Bearer tokens
      - "postgres://[^\\s]+"                   # Postgres URLs
      - "mysql://[^\\s]+"                      # MySQL URLs
      - "mongodb://[^\\s]+"                    # MongoDB URLs
      - "redis://[^\\s]+"                      # Redis URLs
      - "api_key[\\s:=]+[A-Za-z0-9_-]+"       # Generic API keys
      - "secret[\\s:=]+[A-Za-z0-9_-]+"        # Generic secrets
  replacement_token: "[REDACTED]"

# Model configuration
models:
  triage:
    provider: "nebius"
    model: "nvidia/nemotron-nano"
    temperature: 0.1
    max_tokens: 1024
    response_format: "json_object"
  synthesis:
    provider: "nebius"
    model: "nvidia/nemotron-3-ultra"
    temperature: 0.2
    max_tokens: 4096
  research:
    provider: "tavily"
    search_depth: "advanced"
    max_results: 3
    include_domains:
      - "github.com"
      - "stackoverflow.com"
      - "dev.to"
      - "medium.com"
    exclude_domains:
      - "pinterest.com"
      - "quora.com"